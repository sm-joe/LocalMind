name: LocalMind CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - feat/product-workspace-experience

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localmind-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest

    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'ollama/**'
              - 'docker-compose.yml'
              - '.github/ci-compose.yml'

            ci:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'docker-compose.yml'
              - '.github/**'
              - 'tests/**'
              - 'evals/**'
              - 'packages/**'
              - 'Makefile'
              
  gitleaks:
    name: Security - Gitleaks
    # TEMPORARILY DISABLED for product development; restore before public release.
    if: false
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: Security - CodeQL
    # TEMPORARILY DISABLED for product development; restore before public release.
    if: false
    runs-on: ubuntu-latest
    needs: changes

    permissions:
      security-events: write
      actions: read
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  trivy-config:
    name: Security - Trivy Config
    # TEMPORARILY DISABLED for product development; restore before public release.
    if: false
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Scan Repository Configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  api-tests:
    name: API Tests
    # Preserve API integration verification on main; prioritize fast UI builds
    # on the temporary product-workspace development branch.
    if: github.ref != 'refs/heads/feat/product-workspace-experience' && needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    env:
      COMPOSE: docker compose -f docker-compose.yml -f .github/ci-compose.yml
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      LOCALRAG_API_KEY: "ci-localrag-api-key-not-for-production-only"
      LOCALRAG_ADMIN_PASSWORD: "ci-localrag-admin-password-only"
      LOCALRAG_SESSION_SECRET: "ci-localrag-session-secret-not-for-production"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Start Integration Services
        run: |
          $COMPOSE up -d --wait qdrant ollama

      - name: Run API Tests
        run: |
          $COMPOSE run --rm --build api sh -c "alembic upgrade head && pytest -q"

      - name: Show Service Logs On Failure
        if: failure()
        run: |
          $COMPOSE logs --no-color qdrant ollama-init ollama api
          
      - name: Stop Integration Services
        if: always()
        run: |
          $COMPOSE down -v

  product-api-tests:
    name: Product RAG Unit Tests
    if: github.ref == 'refs/heads/feat/product-workspace-experience'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API Dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate RAG retrieval, summary and citations
        run: |
          python -m pytest -q tests/test_parser.py tests/test_index_rebuild.py tests/test_named_entity_qa.py tests/test_comparison_qa.py tests/test_rag_streaming.py tests/test_corpus_summary.py tests/test_llm_context.py tests/test_rag_safety.py tests/test_retrieval.py tests/test_rag_document_lists.py tests/test_vector_store.py tests/test_product_reliability.py

  web-build:
    name: Product Web Build
    if: github.ref == 'refs/heads/feat/product-workspace-experience' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Validate backup and evaluation utilities
        working-directory: .
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest discover -s evals/tests -p 'test_*.py'

      - name: Verify LocalMind And Legacy Compose Secrets
        working-directory: .
        run: |
          export POSTGRES_PASSWORD='ci-db-password-only'
          export LOCALMIND_API_KEY='ci-localmind-api-key-not-for-production-only'
          export LOCALMIND_ADMIN_PASSWORD='ci-localmind-admin-only'
          export LOCALMIND_SESSION_SECRET='ci-localmind-session-secret-not-for-production'
          docker compose config --quiet
          unset LOCALMIND_API_KEY LOCALMIND_ADMIN_PASSWORD LOCALMIND_SESSION_SECRET
          export LOCALRAG_API_KEY='ci-legacy-api-key-not-for-production-only'
          export LOCALRAG_ADMIN_PASSWORD='ci-legacy-admin-password-only'
          export LOCALRAG_SESSION_SECRET='ci-legacy-session-secret-not-for-production'
          docker compose config --quiet

      - name: Validate Bash Helper Syntax
        working-directory: .
        run: bash -n scripts/pull-ollama-model.sh

      - name: Run Web Lint
        run: npm run lint

      - name: Build Web Application
        run: npm run build

  docker-build:
    name: Docker Build
    # Temporarily skip heavy container builds/scans on all pull requests.
    # Keep them on main pushes and for an explicit workflow_dispatch run.
    # TEMPORARILY DISABLED (includes Trivy image scans). Re-enable explicitly
    # after product UI/API work is stable, before distributing the product.
    if: false
    runs-on: ubuntu-latest

    needs:
      - changes
      - gitleaks
      - codeql
      - trivy-config
      - api-tests
      - web-build
    
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          load: true
          tags: localmind-api:ci
          cache-from: type=gha,scope=localmind-api
          cache-to: type=gha,scope=localmind-api,mode=max

      # The table scan is the blocking security gate; it prints the actual
      # CVEs and fixed versions for developers to act on.
      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: localmind-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # SARIF is for reporting; the gate above already enforces severity.
      - name: Generate API SARIF Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: localmind-api:ci
          format: sarif
          output: trivy-api-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload API Trivy Results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api-results.sarif
          category: trivy-container-api

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          load: true
          tags: localmind-web:ci
          cache-from: type=gha,scope=localmind-web
          cache-to: type=gha,scope=localmind-web,mode=max

      # Enforce the vulnerability gate in a readable format.
      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: localmind-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # SARIF export is reporting-only; the scan above is the security gate.
      - name: Generate Web SARIF Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: localmind-web:ci
          format: sarif
          output: trivy-web-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Web Trivy Results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-web-results.sarif
          category: trivy-container-web