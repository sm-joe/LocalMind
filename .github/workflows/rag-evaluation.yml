name: LocalRAG RAG Evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "evals/**"
      - "docker-compose.yml"
      - ".github/ci-compose.yml"
      - ".github/workflows/rag-evaluation.yml"
      - "ollama/**"

  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "evals/**"
      - "docker-compose.yml"
      - ".github/ci-compose.yml"
      - ".github/workflows/rag-evaluation.yml"
      - "ollama/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localrag-rag-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag-evaluation:
    name: RAG Baseline Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Start Qdrant and Ollama
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            up -d --wait qdrant ollama

      - name: Build and Start API
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            up -d --build api

      - name: Wait for API
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-connrefused \
            --retry-delay 2 \
            http://localhost:8000/health

      - name: Upload Evaluation Fixture
        shell: bash
        run: |
          set -euo pipefail

          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --form "file=@evals/fixtures/rag-filename-test.txt;type=text/plain" \
              http://localhost:8000/documents/upload
          )"

          printf '%s\n' "$response"

          python3 -c '
          import json
          import sys

          response = json.load(sys.stdin)

          assert response["filename"] == "rag-filename-test.txt", (
              f"Unexpected indexed filename: {response.get('filename')!r}"
          )
          assert response["chunks"] > 0, (
              "Evaluation fixture produced no chunks"
          )
          assert response["status"] in {"indexed", "already_indexed"}, (
              f"Unexpected indexing status: {response.get('status')!r}"
          )
          ' <<< "$response"

      - name: Run RAG Baseline Evaluation
        run: python3 evals/run_evaluation.py

      - name: Show Service Logs on Failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            logs --no-color api qdrant ollama-init ollama

      - name: Stop Services
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            down -v