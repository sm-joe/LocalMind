name: LocalRAG RAG Evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "evals/**"
      - "docker-compose.yml"
      - "docker-compose.eval.yml"
      - ".github/ci-compose.yml"
      - ".github/workflows/rag-evaluation.yml"
      - "ollama/**"

  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "evals/**"
      - "docker-compose.yml"
      - "docker-compose.eval.yml"
      - ".github/ci-compose.yml"
      - ".github/workflows/rag-evaluation.yml"
      - "ollama/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localrag-rag-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rag-evaluation:
    name: Isolated Multi-Document RAG Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: localrag-eval
      LOCALRAG_EVAL_API_URL: http://localhost:18000
      POSTGRES_PASSWORD: localrag-ci-only-password

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Validate Evaluation Dataset
        run: python3 -m json.tool evals/datasets/localrag_baseline.json > /dev/null

      - name: Build and Start Isolated Evaluation API
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            -f docker-compose.eval.yml \
            up -d --build api

      - name: Wait for API Readiness
        shell: bash
        run: |
          set -uo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error \
              --connect-timeout 3 --max-time 5 \
              "$LOCALRAG_EVAL_API_URL/ready" > /tmp/localrag-health.json 2>/dev/null; then
              echo "Evaluation API dependencies and configured models are ready."
              cat /tmp/localrag-health.json
              exit 0
            fi
            echo "Evaluation API not ready (attempt ${attempt}/90)."
            sleep 2
          done
          echo "::error::Evaluation API did not become healthy."
          docker compose -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.yml -f .github/ci-compose.yml -f docker-compose.eval.yml ps
          docker compose -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.yml -f .github/ci-compose.yml -f docker-compose.eval.yml \
            logs --no-color --tail=250 api qdrant ollama-init ollama postgres
          exit 1

      - name: Run Evaluation Harness Unit Tests
        run: python3 -m unittest discover -s evals/tests -v

      - name: Run API Tests
        shell: bash
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.yml -f .github/ci-compose.yml -f docker-compose.eval.yml \
            exec -T api pytest -q

      - name: Run Self-Provisioning RAG Evaluation
        run: python3 evals/run_evaluation.py

      - name: Upload Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localrag-evaluation-${{ github.run_id }}
          path: evals/results/localrag-evaluation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Show Service Logs on Failure
        if: failure()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.yml -f .github/ci-compose.yml -f docker-compose.eval.yml ps
          docker compose -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.yml -f .github/ci-compose.yml -f docker-compose.eval.yml \
            logs --no-color --tail=300 api qdrant ollama-init ollama postgres

      - name: Stop Isolated Evaluation Services
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" \
            -f docker-compose.yml -f .github/ci-compose.yml -f docker-compose.eval.yml \
            down --volumes --remove-orphans
