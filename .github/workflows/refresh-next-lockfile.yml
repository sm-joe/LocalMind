name: Refresh patched Next.js lockfile (temporary)
on:
  push:
    branches:
      - improve/qdrant-document-retrieval
    paths:
      - .github/workflows/refresh-next-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'sm-joe/localrag' && github.ref == 'refs/heads/improve/qdrant-document-retrieval'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate dependency lockfile from patched packages
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.1
          npm install --package-lock-only --ignore-scripts --save-exact --save-dev eslint-config-next@16.4.1
          npm ci --ignore-scripts
          npm ls next eslint-config-next
      - name: Commit reproducible lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          git diff --cached --quiet || (git commit -m "fix(web): upgrade Next.js to 16.4.1 and refresh npm lockfile" && git push)
