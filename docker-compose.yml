services:
  api:
    build:
      context: ./apps/api
    container_name: localrag-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOCALRAG_API_KEY: ${LOCALMIND_API_KEY:-${LOCALRAG_API_KEY:?Set LOCALMIND_API_KEY (32+ random characters) in .env}}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-6144}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: localrag
      DATABASE_USER: localrag
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env file}
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    networks:
      - frontend
      - backend
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      LOCALRAG_API_INTERNAL_URL: http://api:8000
      LOCALRAG_API_KEY: ${LOCALMIND_API_KEY:-${LOCALRAG_API_KEY:?Set LOCALMIND_API_KEY in .env}}
      LOCALRAG_ADMIN_PASSWORD: ${LOCALMIND_ADMIN_PASSWORD:-${LOCALRAG_ADMIN_PASSWORD:?Set LOCALMIND_ADMIN_PASSWORD in .env}}
      LOCALRAG_SESSION_SECRET: ${LOCALMIND_SESSION_SECRET:-${LOCALRAG_SESSION_SECRET:?Set LOCALMIND_SESSION_SECRET (32+ random characters) in .env}}
    container_name: localrag-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    networks:
      - frontend
    depends_on:
      - api

  postgres:
    image: postgres:17.11
    container_name: localrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: localrag
      POSTGRES_USER: localrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env file}
    volumes:
      - postgres_data_fresh:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: localrag-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.35.1
    container_name: localrag-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /opt/ollama-models
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ollama_models:/opt/ollama-models
    networks:
      - ollama-egress
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        ollama serve >/tmp/ollama-init.log 2>&1 &
        OLLAMA_PID=$$!

        trap 'kill "$${OLLAMA_PID}" 2>/dev/null || true' EXIT

        until ollama list >/dev/null 2>&1; do
          if ! kill -0 "$${OLLAMA_PID}" 2>/dev/null; then
            cat /tmp/ollama-init.log
            exit 1
          fi
          sleep 2
        done

        ensure_model() {
          requested_model="$$1"

          case "$${requested_model}" in
            *:*) expected_model="$${requested_model}" ;;
            *) expected_model="$${requested_model}:latest" ;;
          esac

          if ollama list 2>/dev/null \
            | awk 'NR > 1 {print $$1}' \
            | grep -Fxq "$${expected_model}"; then
            echo "Model already present: $${expected_model}"
            return 0
          fi

          echo "Pulling missing model: $${requested_model}"
          ollama pull "$${requested_model}"
        }

        if [ "$${LLM_MODEL}" = "$${EMBEDDING_MODEL}" ]; then
          ensure_model "$${LLM_MODEL}"
        else
          ensure_model "$${EMBEDDING_MODEL}" &
          EMBEDDING_PULL_PID=$$!

          ensure_model "$${LLM_MODEL}" &
          LLM_PULL_PID=$$!

          pull_status=0
          wait "$${EMBEDDING_PULL_PID}" || pull_status=1
          wait "$${LLM_PULL_PID}" || pull_status=1

          if [ "$${pull_status}" -ne 0 ]; then
            echo "One or more Ollama model pulls failed."
            exit 1
          fi
        fi

        # The init image runs as root, while the serving image deliberately
        # uses UID/GID 10001. Without transferring ownership of the shared
        # named volume, later model pulls fail with EACCES on blobs/*-partial-*.
        chown -R 10001:10001 /opt/ollama-models
        echo "Ollama model initialization completed."

  ollama:
    build:
      context: ./ollama
    container_name: localrag-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /opt/ollama-models
    volumes:
      - ollama_models:/opt/ollama-models
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

  ollama-egress:
    driver: bridge

volumes:
  qdrant_data:
  ollama_models:
  postgres_data:
    name: localrag_postgres_data_recovered
  postgres_data_fresh:
    name: localrag_postgres_fresh_20261012_185803_386b33
